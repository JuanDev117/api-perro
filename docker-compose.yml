services:
  caniscare-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caniscare-frontend
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8081}"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${PORT:-8080}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      caniscare-db:
        condition: service_healthy
    restart: unless-stopped

  caniscare-db:
    image: postgres:16-alpine
    container_name: caniscare-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_NAME:-neondb}"
      POSTGRES_USER: "${DB_USER:-neondb_owner}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-npg_5EchUnxOC9Te}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - caniscare_db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-neondb_owner} -d ${DB_NAME:-neondb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  caniscare_db_data:
    driver: local
